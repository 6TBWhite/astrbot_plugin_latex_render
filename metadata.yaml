short_desc: 把 Markdown、LaTeX 公式与长文本排成适合聊天窗口阅读的图片
desc: 面向 AstrBot 的本地图片渲染插件。它提供可由 LLM 主动调用的 render_to_image 工具，将 Markdown、LaTeX 公式、表格与长文本渲染为图片；内置 classic 与 novel 模板，支持离线 MathJax、模板切换和可调排版参数。
