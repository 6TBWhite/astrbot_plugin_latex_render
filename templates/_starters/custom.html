<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: fit-content;
            min-width: 100%;
            max-width: 720px;
            margin: 0;
        }

        body {
            padding: 24px;
            color: #e9ecff;
            background:
                radial-gradient(circle at 12% 8%, rgba(122, 92, 255, .34), transparent 34%),
                radial-gradient(circle at 88% 92%, rgba(34, 211, 238, .2), transparent 38%),
                #090b18;
            font-family: "Source Han Sans SC", "Noto Sans CJK SC", "PingFang SC",
                "Microsoft YaHei", sans-serif;
        }

        .aurora-card {
            position: relative;
            min-width: 340px;
            padding: 30px 32px 34px;
            overflow: hidden;
            border: 1px solid rgba(186, 195, 255, .22);
            border-radius: 22px;
            background:
                linear-gradient(135deg, rgba(255, 255, 255, .1), rgba(255, 255, 255, .035)),
                rgba(17, 20, 42, .9);
            box-shadow:
                0 26px 70px rgba(0, 0, 0, .42),
                inset 0 1px 0 rgba(255, 255, 255, .12);
        }

        .aurora-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 32px;
            width: 108px;
            height: 4px;
            border-radius: 0 0 4px 4px;
            background: linear-gradient(90deg, #8b5cf6, #22d3ee);
            box-shadow: 0 0 22px rgba(99, 102, 241, .65);
        }

        .aurora-card::after {
            content: "AURORA  /  CUSTOM";
            display: block;
            margin-top: 24px;
            color: rgba(203, 213, 255, .48);
            font: 700 10px/1.2 "Cascadia Code", "Consolas", monospace;
            letter-spacing: .18em;
        }

        .content {
            position: relative;
            width: 100%;
            max-width: 100%;
            color: #e9ecff;
            font-size: 19px;
            line-height: 1.75;
            overflow: hidden;
        }

        .content *,
        .content *::before,
        .content *::after {
            max-width: 100%;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .content h1,
        .content h2,
        .content h3 {
            color: #ffffff;
            line-height: 1.3;
            text-wrap: balance;
        }

        .content h1 {
            margin: 0 0 .7em;
            font-size: 32px;
            letter-spacing: -.035em;
        }

        .content h1::after {
            content: "";
            display: block;
            width: 56px;
            height: 3px;
            margin-top: 12px;
            border-radius: 99px;
            background: linear-gradient(90deg, #a78bfa, #22d3ee);
        }

        .content h2 {
            margin: 1.4em 0 .65em;
            font-size: 25px;
        }

        .content h3 {
            margin: 1.2em 0 .55em;
            color: #c4b5fd;
            font-size: 21px;
        }

        .content p {
            margin: 0 0 .8em;
        }

        .content strong {
            color: #ffffff;
        }

        .content a {
            color: #67e8f9;
            text-decoration-color: rgba(103, 232, 249, .45);
        }

        .content ul,
        .content ol {
            margin: .65em 0 1em;
            padding-left: 1.5em;
        }

        .content li {
            margin: .3em 0;
        }

        .content li::marker {
            color: #a78bfa;
        }

        .content blockquote {
            margin: 1em 0;
            padding: 12px 16px;
            border: 1px solid rgba(103, 232, 249, .2);
            border-left: 4px solid #22d3ee;
            border-radius: 0 12px 12px 0;
            color: #d9e5ff;
            background: rgba(34, 211, 238, .07);
        }

        .content code {
            padding: 2px 6px;
            border: 1px solid rgba(196, 181, 253, .15);
            border-radius: 6px;
            color: #ddd6fe;
            background: rgba(139, 92, 246, .13);
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: .88em;
        }

        .content pre {
            margin: 1em 0;
            padding: 16px 18px;
            overflow: hidden;
            border: 1px solid rgba(186, 195, 255, .16);
            border-radius: 13px;
            background: rgba(5, 7, 20, .72);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .04);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .content pre code {
            padding: 0;
            border: 0;
            color: #dbeafe;
            background: transparent;
        }

        .content table {
            width: 100%;
            margin: 1em 0;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid rgba(186, 195, 255, .18);
            border-radius: 12px;
            table-layout: fixed;
            font-size: .92em;
        }

        .content th,
        .content td {
            padding: 9px 11px;
            border-right: 1px solid rgba(186, 195, 255, .12);
            border-bottom: 1px solid rgba(186, 195, 255, .12);
            text-align: left;
            word-break: break-word;
        }

        .content th:last-child,
        .content td:last-child {
            border-right: 0;
        }

        .content tr:last-child td {
            border-bottom: 0;
        }

        .content th {
            color: #ffffff;
            background: rgba(139, 92, 246, .16);
        }

        .content hr {
            height: 1px;
            margin: 1.5em 0;
            border: 0;
            background: linear-gradient(90deg, transparent, rgba(167, 139, 250, .6), transparent);
        }

        .content img,
        .content svg,
        .content canvas {
            height: auto;
        }

        .content mjx-container[display="true"] {
            margin: 1em 0 !important;
            padding: 10px 6px;
            overflow-x: auto;
            overflow-y: hidden;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <article class="aurora-card">
        <main class="content">{{content}}</main>
    </article>
</body>
</html>
