<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: fit-content;
            min-width: 100%;
            max-width: 720px;
            margin: 0;
        }

        body {
            padding: 28px;
            color: #26221c;
            background: #e9e2d3;
            font-family: "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC",
                "SimSun", "Georgia", serif;
        }

        .broadside {
            min-width: 340px;
            padding: 40px 44px 44px;
            background: #faf6ec;
            border: 1px solid #d5cbb6;
            box-shadow: 0 12px 34px rgba(84, 66, 40, .16);
        }

        .broadside::before {
            content: "";
            display: block;
            height: 3px;
            margin-bottom: 22px;
            background:
                linear-gradient(90deg, #22201a 0 36%, transparent 36% 64%, #22201a 64%);
        }

        .broadside + .broadside {
            margin-top: 0;
        }

        .content {
            width: 100%;
            max-width: 100%;
            color: #26221c;
            font-size: 17px;
            line-height: 1.9;
            overflow: hidden;
        }

        .content *,
        .content *::before,
        .content *::after {
            max-width: 100%;
            box-sizing: border-box;
            overflow-wrap: anywhere;
        }

        .content h1,
        .content h2,
        .content h3 {
            color: #14120e;
            line-height: 1.35;
            text-wrap: balance;
        }

        .content h1 {
            margin: 0 0 .6em;
            font-size: 34px;
            font-weight: 900;
            letter-spacing: -.01em;
        }

        .content h1::after {
            content: "";
            display: block;
            width: 100%;
            height: 4px;
            margin-top: 14px;
            border-top: 2px solid #14120e;
            border-bottom: 1px solid rgba(20, 18, 14, .35);
        }

        .content h2 {
            margin: 1.5em 0 .6em;
            padding-bottom: .3em;
            font-size: 24px;
            font-weight: 700;
            border-bottom: 1px solid rgba(20, 18, 14, .22);
        }

        .content h3 {
            margin: 1.3em 0 .55em;
            color: #6b2d20;
            font-size: 20px;
            font-weight: 700;
        }

        .content p {
            margin: 0 0 .9em;
        }

        .content strong {
            color: #14120e;
        }

        .content a {
            color: #6b2d20;
            text-decoration-color: rgba(107, 45, 32, .45);
        }

        .content ul,
        .content ol {
            margin: .7em 0 1.1em;
            padding-left: 1.6em;
        }

        .content li {
            margin: .35em 0;
        }

        .content li::marker {
            color: #6b2d20;
        }

        .content blockquote {
            margin: 1.1em 0;
            padding: 14px 18px;
            border: 1px solid rgba(107, 45, 32, .2);
            border-left: 4px solid #6b2d20;
            border-radius: 0 6px 6px 0;
            color: #3d3529;
            background: rgba(107, 45, 32, .05);
            font-style: italic;
        }

        .content code {
            padding: 2px 6px;
            border: 1px solid rgba(38, 34, 28, .16);
            border-radius: 4px;
            color: #4a2c22;
            background: rgba(38, 34, 28, .06);
            font-family: "Cascadia Code", "Consolas", monospace;
            font-size: .9em;
        }

        .content pre {
            margin: 1.1em 0;
            padding: 16px 18px;
            overflow: hidden;
            border: 1px solid rgba(38, 34, 28, .18);
            border-radius: 6px;
            color: #f0ead9;
            background: #201d17;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, .06);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .content pre code {
            padding: 0;
            border: 0;
            color: #f0ead9;
            background: transparent;
        }

        .content table {
            width: 100%;
            margin: 1.1em 0;
            overflow: hidden;
            border-collapse: separate;
            border-spacing: 0;
            border: 1px solid rgba(38, 34, 28, .3);
            border-radius: 6px;
            table-layout: fixed;
            font-size: .95em;
        }

        .content th,
        .content td {
            padding: 10px 12px;
            border-right: 1px solid rgba(38, 34, 28, .14);
            border-bottom: 1px solid rgba(38, 34, 28, .14);
            text-align: left;
            word-break: break-word;
        }

        .content th:last-child,
        .content td:last-child {
            border-right: 0;
        }

        .content tr:last-child td {
            border-bottom: 0;
        }

        .content th {
            color: #14120e;
            background: rgba(38, 34, 28, .08);
            font-weight: 700;
        }

        .content hr {
            height: 1px;
            margin: 1.6em 0;
            border: 0;
            border-top: 1px solid rgba(20, 18, 14, .3);
        }

        .content img,
        .content svg,
        .content canvas {
            height: auto;
        }

        .content mjx-container[display="true"] {
            margin: 1em 0 !important;
            padding: 10px 6px;
            overflow-x: auto;
            overflow-y: hidden;
            color: #14120e;
        }
    </style>
</head>
<body>
    <article class="broadside">
        <main class="content">{{content}}</main>
    </article>
</body>
</html>
